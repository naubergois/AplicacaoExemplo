<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Fluxos - Passagens Aereas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5efe5;
        --panel: #fffaf1;
        --ink: #1f2430;
        --muted: #667085;
        --brand: #ff7a18;
        --brand-2: #ffb347;
        --ok: #0ea66c;
        --warn: #b07b00;
        --danger: #c13515;
        --shadow: 0 18px 40px rgba(31, 36, 48, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Manrope", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 10% 10%, #fff6d9 0%, transparent 38%),
          radial-gradient(circle at 90% 0%, #ffd4ba 0%, transparent 32%),
          linear-gradient(145deg, #f7f0e5, #efe6d8 70%);
        min-height: 100vh;
      }

      .container {
        width: min(1100px, 92vw);
        margin: 28px auto 36px;
      }

      .hero {
        background: linear-gradient(120deg, #1f2430, #31394c 58%, #3f4760);
        color: #fff;
        border-radius: 24px;
        padding: 28px;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
      }

      .hero::after {
        content: "";
        position: absolute;
        width: 340px;
        height: 340px;
        right: -90px;
        top: -120px;
        background: radial-gradient(circle, rgba(255, 179, 71, 0.35), transparent 70%);
      }

      h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(1.4rem, 3vw, 2rem);
      }

      .subtitle {
        margin-top: 10px;
        max-width: 72ch;
        color: #e8edf8;
      }

      .toolbar {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 11px 14px;
        font-family: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.16s ease, filter 0.16s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
        transform: none;
      }

      .btn-primary {
        background: linear-gradient(90deg, var(--brand), var(--brand-2));
        color: #1f2430;
      }

      .btn-ghost {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .grid {
        margin-top: 22px;
        display: grid;
        gap: 14px;
      }

      .card {
        background: var(--panel);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 8px 22px rgba(31, 36, 48, 0.08);
        border: 1px solid #ebddca;
        animation: fadeInUp 0.28s ease both;
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .title {
        font-weight: 800;
      }

      .badge {
        font-size: 0.76rem;
        padding: 5px 10px;
        border-radius: 999px;
        background: #f7ead8;
      }

      .intent-atendimento {
        background: #dff7ef;
        color: #0a7b4f;
      }

      .intent-vendas {
        background: #fef0d5;
        color: #966b00;
      }

      .intent-cancelamento {
        background: #fee2dd;
        color: #9f2510;
      }

      .meta {
        color: var(--muted);
        font-size: 0.92rem;
        margin-top: 6px;
      }

      .response {
        margin-top: 12px;
        white-space: pre-wrap;
        line-height: 1.5;
      }

      .status {
        margin-top: 16px;
        font-weight: 600;
      }

      .summary {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
      }

      .kpi {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .kpi b {
        display: block;
        font-size: 1.2rem;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .container {
          width: 94vw;
          margin-top: 14px;
        }

        .hero {
          border-radius: 18px;
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const cenariosBase = [
        {
          titulo: "Atendimento - duvida sobre bagagem",
          payload: {
            message: "Qual e a franquia de bagagem para voo internacional?",
            customer_name: "Ana",
          },
        },
        {
          titulo: "Atendimento - programa de milhas",
          payload: {
            message: "Como funciona o programa de milhas e acumulacao de pontos?",
            customer_name: "Rafael",
          },
        },
        {
          titulo: "Vendas - viagem nacional",
          payload: {
            message: "Quero comprar passagem de Recife para Sao Paulo no proximo feriado.",
            customer_name: "Bruna",
          },
        },
        {
          titulo: "Vendas - viagem internacional",
          payload: {
            message: "Preciso de voo para Lisboa em outubro para 2 adultos e 1 crianca.",
            customer_name: "Marcelo",
          },
        },
        {
          titulo: "Vendas - tarifa executiva",
          payload: {
            message: "Tem opcao de classe executiva com bagagem extra para Nova York?",
            customer_name: "Carolina",
          },
        },
        {
          titulo: "Cancelamento - com codigo de reserva",
          payload: {
            message: "Quero cancelar minha passagem por mudanca de planos.",
            customer_name: "Paulo",
            reservation_code: "ZXC123",
          },
        },
        {
          titulo: "Cancelamento - sem codigo de reserva",
          payload: {
            message: "Preciso cancelar minha viagem urgente.",
            customer_name: "Luciana",
          },
        },
        {
          titulo: "Cancelamento - pedido de reembolso",
          payload: {
            message: "Solicito cancelamento e gostaria de saber o prazo de estorno.",
            customer_name: "Diego",
            reservation_code: "LMN456",
          },
        },
        {
          titulo: "Atendimento - alteracao de assento",
          payload: {
            message: "Consigo alterar o assento depois de emitir a passagem?",
            customer_name: "Fernanda",
          },
        },
      ];

      function App() {
        const [cenarios, setCenarios] = React.useState(
          cenariosBase.map((c) => ({
            ...c,
            status: "pendente",
            intent: null,
            response: null,
            erro: null,
          }))
        );
        const [executando, setExecutando] = React.useState(false);
        const [status, setStatus] = React.useState("Pronto para simular os fluxos.");

        const resumo = React.useMemo(() => {
          const base = { atendimento: 0, vendas: 0, cancelamento: 0 };
          for (const c of cenarios) {
            if (c.intent && base[c.intent] !== undefined) {
              base[c.intent] += 1;
            }
          }
          return base;
        }, [cenarios]);

        async function executarCenario(index) {
          setCenarios((anterior) =>
            anterior.map((item, idx) =>
              idx === index ? { ...item, status: "executando", erro: null } : item
            )
          );

          const payload = cenariosBase[index].payload;
          try {
            const resp = await fetch("/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            const dados = await resp.json();
            if (!resp.ok) {
              throw new Error(dados.detail || "Falha ao chamar /chat");
            }

            setCenarios((anterior) =>
              anterior.map((item, idx) =>
                idx === index
                  ? {
                      ...item,
                      status: "ok",
                      intent: dados.intent,
                      response: dados.response,
                      erro: null,
                    }
                  : item
              )
            );
          } catch (err) {
            setCenarios((anterior) =>
              anterior.map((item, idx) =>
                idx === index
                  ? {
                      ...item,
                      status: "erro",
                      erro: err.message || "Erro inesperado",
                      response: null,
                    }
                  : item
              )
            );
          }
        }

        async function executarTodos() {
          setExecutando(true);
          setStatus("Executando todos os cenarios...");

          setCenarios(
            cenariosBase.map((c) => ({
              ...c,
              status: "pendente",
              intent: null,
              response: null,
              erro: null,
            }))
          );

          for (let i = 0; i < cenariosBase.length; i++) {
            setStatus(`Executando cenario ${i + 1} de ${cenariosBase.length}...`);
            await executarCenario(i);
          }

          setStatus("Simulacao finalizada.");
          setExecutando(false);
        }

        function limparResultados() {
          setCenarios(
            cenariosBase.map((c) => ({
              ...c,
              status: "pendente",
              intent: null,
              response: null,
              erro: null,
            }))
          );
          setStatus("Resultados limpos.");
        }

        function classeIntent(intent) {
          if (!intent) return "badge";
          return `badge intent-${intent}`;
        }

        function nomeAgente(intent, status) {
          if (!intent) {
            if (status === "erro") return "Nao foi possivel identificar o agente";
            return "Agente ainda nao acionado";
          }

          if (intent === "atendimento") return "Agente de Atendimento";
          if (intent === "vendas") return "Agente de Vendas";
          if (intent === "cancelamento") return "Agente de Cancelamento";
          return "Agente nao identificado";
        }

        return (
          <div className="container">
            <section className="hero">
              <h1>Simulador de Fluxos de Atendimento, Vendas e Cancelamento</h1>
              <p className="subtitle">
                Esta tela React executa todos os cenarios da simulacao e mostra a resposta do
                agente selecionado pelo LangGraph em cada caso.
              </p>

              <div className="toolbar">
                <button className="btn-primary" onClick={executarTodos} disabled={executando}>
                  {executando ? "Executando..." : "Executar todos os cenarios"}
                </button>
                <button className="btn-ghost" onClick={limparResultados} disabled={executando}>
                  Limpar resultados
                </button>
              </div>

              <p className="status">{status}</p>

              <div className="summary">
                <div className="kpi">
                  Atendimento
                  <b>{resumo.atendimento}</b>
                </div>
                <div className="kpi">
                  Vendas
                  <b>{resumo.vendas}</b>
                </div>
                <div className="kpi">
                  Cancelamento
                  <b>{resumo.cancelamento}</b>
                </div>
              </div>
            </section>

            <section className="grid">
              {cenarios.map((cenario, idx) => (
                <article key={idx} className="card">
                  <div className="card-head">
                    <div className="title">{`Cenario ${idx + 1} - ${cenario.titulo}`}</div>
                    <span className={classeIntent(cenario.intent)}>
                      {cenario.intent || cenario.status}
                    </span>
                  </div>

                  <p className="meta">
                    Cliente: {cenario.payload.customer_name || "Nao informado"} | Reserva: {" "}
                    {cenario.payload.reservation_code || "Nao informado"}
                  </p>
                  <p className="meta">
                    Agente que atendeu: {nomeAgente(cenario.intent, cenario.status)}
                  </p>
                  <p className="meta">Mensagem: {cenario.payload.message}</p>

                  <div className="toolbar" style={{ marginTop: "10px" }}>
                    <button
                      className="btn-primary"
                      disabled={executando || cenario.status === "executando"}
                      onClick={() => executarCenario(idx)}
                    >
                      {cenario.status === "executando" ? "Executando..." : "Executar cenario"}
                    </button>
                  </div>

                  {cenario.erro && (
                    <div className="response" style={{ color: "var(--danger)", fontWeight: 700 }}>
                      Erro: {cenario.erro}
                    </div>
                  )}

                  {cenario.response && <div className="response">{cenario.response}</div>}
                </article>
              ))}
            </section>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
