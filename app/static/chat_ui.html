<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat de Atendimento - Agentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3efe7;
        --ink: #202530;
        --panel: #fffaf1;
        --line: #eadfce;
        --brand: #ff7a18;
        --brand2: #ffba4a;
        --user: #263046;
        --agent: #ffffff;
        --muted: #697183;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Manrope, sans-serif;
        background: radial-gradient(circle at 6% 0, #ffe7bd 0%, transparent 38%),
          radial-gradient(circle at 98% 5%, #ffd8c5 0%, transparent 32%),
          linear-gradient(145deg, #f3efe7, #efe4d5 70%);
        color: var(--ink);
        min-height: 100vh;
      }
      .wrap {
        width: min(1240px, 96vw);
        margin: 18px auto 26px;
      }
      .hero {
        background: linear-gradient(130deg, #202530, #323b50 58%, #434f69);
        color: #fff;
        border-radius: 20px;
        padding: 20px;
      }
      h1 {
        margin: 0;
        font: 700 clamp(1.2rem, 2.7vw, 1.8rem) "Space Grotesk", sans-serif;
      }
      .sub { margin-top: 8px; color: #e5ebf8; }
      .controls {
        margin-top: 14px;
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
      }
      .controls input {
        border: 1px solid rgba(255,255,255,.26);
        background: rgba(255,255,255,.12);
        color: #fff;
        border-radius: 10px;
        padding: 10px 12px;
        outline: none;
      }
      .controls input::placeholder { color: #dbe3f5; }
      .panel {
        margin-top: 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px 300px;
      }
      .memory {
        border-left: 1px solid var(--line);
        background: #fff6ea;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .calls {
        border-left: 1px solid var(--line);
        background: #f4f7ff;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .calls h3 {
        margin: 0;
        font: 700 1rem "Space Grotesk", sans-serif;
      }
      .calls-hint {
        font-size: .78rem;
        color: #5b6478;
      }
      .calls-list {
        display: grid;
        gap: 8px;
        max-height: 460px;
        overflow: auto;
      }
      .call-item {
        background: #fff;
        border: 1px solid #d9e1f5;
        border-left: 4px solid #4f6bd8;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: .8rem;
      }
      .call-item.tool {
        border-left-color: #ff7a18;
      }
      .call-item.route {
        border-left-color: #2fa96b;
      }
      .call-agent {
        font-weight: 700;
        color: #26304a;
      }
      .call-tool {
        display: inline-block;
        margin-top: 3px;
        font-family: "Space Grotesk", monospace;
        font-size: .72rem;
        background: #eef2ff;
        color: #3446a6;
        padding: 2px 7px;
        border-radius: 999px;
      }
      .call-tool.is-tool { background: #fff0e2; color: #b5560c; }
      .call-detail {
        margin-top: 5px;
        color: #4a5468;
        line-height: 1.3;
      }
      .reasoning {
        align-self: flex-start;
        max-width: min(90%, 780px);
        background: #f4f0ff;
        border: 1px dashed #c8bcf0;
        border-radius: 14px;
        padding: 12px;
      }
      .reasoning .rz-title {
        font: 700 .82rem "Space Grotesk", sans-serif;
        color: #5b3fb0;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .rz-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #7c5cf0;
        animation: pulse 1s infinite ease-in-out;
      }
      @keyframes pulse { 0%,100%{opacity:.3;} 50%{opacity:1;} }
      .rz-text {
        white-space: pre-wrap;
        font-size: .84rem;
        color: #3a3157;
        line-height: 1.4;
      }
      .rz-steps {
        margin-top: 8px;
        display: grid;
        gap: 4px;
      }
      .rz-step {
        font-size: .76rem;
        color: #52506b;
      }
      .rz-step code {
        background: #ece6ff;
        padding: 1px 5px;
        border-radius: 6px;
        color: #5b3fb0;
      }
      .memory h3 {
        margin: 0;
        font: 700 1rem "Space Grotesk", sans-serif;
      }
      .memory-card {
        background: #fff;
        border: 1px solid #ebddca;
        border-radius: 12px;
        padding: 10px;
      }
      .memory-row {
        font-size: .86rem;
        color: #505a6f;
        margin-top: 4px;
      }
      .memory-summary {
        white-space: pre-wrap;
        font-size: .84rem;
        color: #364055;
        line-height: 1.35;
      }
      .memory-log {
        max-height: 200px;
        overflow: auto;
        display: grid;
        gap: 8px;
      }
      .memory-log-item {
        background: #fff;
        border: 1px solid #ebddca;
        border-radius: 10px;
        padding: 8px;
        font-size: .82rem;
      }
      .chat {
        height: min(65vh, 640px);
        overflow: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: min(90%, 780px);
        border-radius: 14px;
        padding: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        border: 1px solid transparent;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user);
        color: #fff;
      }
      .msg.agent {
        align-self: flex-start;
        background: var(--agent);
        border-color: var(--line);
      }
      .meta {
        margin-bottom: 6px;
        color: var(--muted);
        font-size: .84rem;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .badge {
        background: #f4ead8;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: .75rem;
      }
      .badge.tool-badge {
        background: #fff0e2;
        color: #b5560c;
        font-weight: 700;
      }
      .composer {
        border-top: 1px solid var(--line);
        padding: 10px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }
      textarea {
        width: 100%;
        min-height: 64px;
        max-height: 190px;
        resize: vertical;
        border: 1px solid #d7c9b5;
        border-radius: 12px;
        padding: 10px 12px;
        font: 500 .96rem Manrope, sans-serif;
        color: var(--ink);
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 0 16px;
        font-weight: 800;
        cursor: pointer;
        background: linear-gradient(90deg, var(--brand), var(--brand2));
        color: #1f2430;
      }
      button:disabled { opacity: .6; cursor: not-allowed; }
      .hint { color: #5e6779; font-size: .88rem; margin-top: 10px; }

      /* ===== Seccao didatica: como o LangChain e usado ===== */
      .edu {
        margin-top: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 18px 6px;
      }
      .edu h2 {
        margin: 0 0 4px;
        font: 700 clamp(1.05rem, 2.2vw, 1.4rem) "Space Grotesk", sans-serif;
      }
      .edu .edu-lead {
        color: var(--muted);
        margin: 0 0 14px;
        font-size: .92rem;
      }
      .edu .steps {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        margin-bottom: 14px;
      }
      .edu .step {
        background: #fff6ea;
        border: 1px solid #ebddca;
        border-radius: 12px;
        padding: 10px;
      }
      .edu .step .num {
        display: inline-flex;
        width: 22px; height: 22px;
        align-items: center; justify-content: center;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--brand), var(--brand2));
        color: #1f2430;
        font-weight: 800; font-size: .8rem;
        margin-bottom: 6px;
      }
      .edu .step strong { display: block; font-size: .9rem; }
      .edu .step span { font-size: .8rem; color: #5e6779; }
      .edu details {
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 10px;
        background: #fff;
        overflow: hidden;
      }
      .edu summary {
        cursor: pointer;
        list-style: none;
        padding: 12px 14px;
        font: 700 1rem "Space Grotesk", sans-serif;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .edu summary::-webkit-details-marker { display: none; }
      .edu summary::before {
        content: "+";
        display: inline-flex;
        width: 20px; height: 20px;
        align-items: center; justify-content: center;
        border-radius: 6px;
        background: #f4ead8;
        font-weight: 800;
      }
      .edu details[open] summary::before { content: "\2212"; }
      .edu summary .tag {
        margin-left: auto;
        font: 600 .72rem Manrope, sans-serif;
        color: #7a5a2a;
        background: #ffe7bd;
        padding: 3px 9px;
        border-radius: 999px;
      }
      .edu .body {
        padding: 0 14px 14px;
        font-size: .9rem;
        color: #384154;
        line-height: 1.5;
      }
      .edu .body ul { margin: 8px 0; padding-left: 18px; }
      .edu .body li { margin: 4px 0; }
      .edu .body .file {
        font: 600 .78rem "Space Grotesk", monospace;
        color: #8a4b12;
      }
      .edu pre {
        background: #1f2430;
        color: #e8ecf6;
        border-radius: 10px;
        padding: 12px;
        overflow: auto;
        font: 500 .8rem ui-monospace, SFMono-Regular, Menlo, monospace;
        line-height: 1.5;
        margin: 8px 0 0;
      }
      .edu .callout {
        background: #fff6ea;
        border: 1px dashed #e2c79b;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: .85rem;
        color: #6a5327;
        margin-top: 10px;
      }
      @media (max-width: 760px) {
        .controls { grid-template-columns: 1fr; }
        .composer { grid-template-columns: 1fr; }
        button { height: 44px; }
        .workspace { grid-template-columns: 1fr; }
        .memory { border-left: 0; border-top: 1px solid var(--line); }
        .calls { border-left: 0; border-top: 1px solid var(--line); }
      }
      @media (max-width: 1080px) and (min-width: 761px) {
        .workspace { grid-template-columns: minmax(0, 1fr) 300px; }
        .calls { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function App() {
        const [customerName, setCustomerName] = React.useState("Cliente");
        const [reservationCode, setReservationCode] = React.useState("");
        const [draft, setDraft] = React.useState("");
        const [sending, setSending] = React.useState(false);
        const [memoryView, setMemoryView] = React.useState(null);
        const [memoryLoading, setMemoryLoading] = React.useState(false);
        const [thinking, setThinking] = React.useState(null);
        const [deepseekCalls, setDeepseekCalls] = React.useState([]);
        const [messages, setMessages] = React.useState([
          {
            id: crypto.randomUUID(),
            role: "agent",
            text: "Ola! Digite sua mensagem para iniciar o atendimento.",
            meta: { agente: "Sistema", intent: "-", tarefa: "Inicializacao" },
          },
        ]);

        const chatRef = React.useRef(null);

        React.useEffect(() => {
          if (chatRef.current) {
            chatRef.current.scrollTop = chatRef.current.scrollHeight;
          }
        }, [messages]);

        async function carregarMemoria(nome) {
          const cleanName = (nome || "").trim();
          if (!cleanName) {
            setMemoryView(null);
            return null;
          }

          setMemoryLoading(true);
          try {
            const resp = await fetch(`/memory/${encodeURIComponent(cleanName)}`);
            const data = await resp.json();
            if (!resp.ok) {
              throw new Error(data.detail || "Falha ao carregar memoria do cliente");
            }
            setMemoryView(data);
            return data;
          } catch (err) {
            setMemoryView({
              customer_name: cleanName,
              has_memory: false,
              summary: `Erro ao carregar memoria: ${err.message || "erro inesperado"}`,
              recent_interactions: [],
              langchain_history_size: 0,
            });
            return null;
          } finally {
            setMemoryLoading(false);
          }
        }

        function classificarChamada(step) {
          const etapa = step.etapa || "";
          const tool = step.tool || "";
          if (etapa === "roteamento") return "route";
          if (etapa === "tool" || etapa === "delegacao") return "tool";
          if (tool.startsWith("llm")) return "llm";
          return "info";
        }

        async function enviarMensagem() {
          const texto = draft.trim();
          if (!texto || sending) return;
          const nomeAtual = (customerName || "").trim();

          if (nomeAtual) {
            await carregarMemoria(nomeAtual);
          }

          const userMsg = {
            id: crypto.randomUUID(),
            role: "user",
            text: texto,
          };
          setMessages((prev) => [...prev, userMsg]);
          setDraft("");
          setSending(true);
          setDeepseekCalls([]);
          setThinking({ reasoning: "", steps: [], label: "Analisando a mensagem..." });

          try {
            const resp = await fetch("/chat/stream", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                message: texto,
                customer_name: nomeAtual || undefined,
                reservation_code: reservationCode || undefined,
              }),
            });

            if (!resp.ok || !resp.body) {
              const data = await resp.json().catch(() => ({}));
              throw new Error(data.detail || "Falha ao chamar o endpoint /chat/stream");
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let finalData = null;
            let streamError = null;

            const handleEvent = (evName, payload) => {
              if (evName === "reasoning") {
                setThinking((prev) => ({
                  ...(prev || { reasoning: "", steps: [] }),
                  label: "Raciocinio do modelo (DeepSeek)...",
                  reasoning: (prev?.reasoning || "") + (payload.token || ""),
                }));
              } else if (evName === "reasoning_start") {
                setThinking((prev) => ({
                  ...(prev || { reasoning: "", steps: [] }),
                  label: "Raciocinio do modelo (DeepSeek)...",
                }));
              } else if (evName === "decision") {
                setThinking((prev) => ({
                  ...(prev || { reasoning: "", steps: [] }),
                  label: `Encaminhado para ${payload.agente_responsavel || "agente"}...`,
                }));
              } else if (evName === "trace") {
                const tipo = classificarChamada(payload);
                setThinking((prev) => ({
                  ...(prev || { reasoning: "", steps: [] }),
                  steps: [...((prev && prev.steps) || []), payload],
                }));
                if (tipo === "llm" || tipo === "tool" || tipo === "route") {
                  setDeepseekCalls((prev) => [
                    ...prev,
                    {
                      id: crypto.randomUUID(),
                      tipo,
                      agente: payload.agente || "-",
                      tool: payload.tool || "-",
                      detalhe: payload.detalhe || "",
                    },
                  ]);
                }
              } else if (evName === "done") {
                finalData = payload;
              } else if (evName === "error") {
                streamError = payload.detail || "Erro no streaming";
              }
            };

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const blocks = buffer.split("\n\n");
              buffer = blocks.pop() || "";
              for (const block of blocks) {
                if (!block.trim()) continue;
                let evName = "message";
                const dataLines = [];
                for (const line of block.split("\n")) {
                  if (line.startsWith("event:")) evName = line.slice(6).trim();
                  else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
                }
                if (!dataLines.length) continue;
                let payload = {};
                try {
                  payload = JSON.parse(dataLines.join("\n"));
                } catch (e) {
                  continue;
                }
                handleEvent(evName, payload);
              }
            }

            if (streamError) {
              throw new Error(streamError);
            }

            const botMsg = {
              id: crypto.randomUUID(),
              role: "agent",
              text: (finalData && finalData.response) || "Sem resposta.",
              meta: {
                agente: (finalData && finalData.agente_responsavel) || "Nao informado",
                intent: (finalData && finalData.intent) || "-",
                tarefa: (finalData && finalData.tarefa) || "-",
                tools: (finalData && finalData.tools_utilizadas) || [],
              },
            };
            setMessages((prev) => [...prev, botMsg]);

            if (finalData && finalData.memoria) {
              setMemoryView((prev) => ({ ...(prev || {}), ...finalData.memoria }));
            }
            if (nomeAtual) {
              await carregarMemoria(nomeAtual);
            }
          } catch (err) {
            setMessages((prev) => [
              ...prev,
              {
                id: crypto.randomUUID(),
                role: "agent",
                text: `Erro: ${err.message || "erro inesperado"}`,
                meta: { agente: "Erro", intent: "-", tarefa: "Falha de requisicao" },
              },
            ]);
          } finally {
            setThinking(null);
            setSending(false);
          }
        }

        function onKeyDown(e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            enviarMensagem();
          }
        }

        return (
          <div className="wrap">
            <section className="hero">
              <h1>Chat de Atendimento com Orquestracao de Agentes</h1>
              <p className="sub">
                Converse em tempo real e veja qual agente respondeu cada mensagem.
              </p>

              <div className="controls">
                <input
                  value={customerName}
                  onChange={(e) => setCustomerName(e.target.value)}
                  placeholder="Nome do cliente"
                />
                <input
                  value={reservationCode}
                  onChange={(e) => setReservationCode(e.target.value)}
                  placeholder="Codigo da reserva (opcional)"
                />
                <input value="/chat/stream" disabled />
              </div>
            </section>

            <section className="panel">
              <div className="workspace">
                <div>
                  <div className="chat" ref={chatRef}>
                    {messages.map((m) => (
                      <article key={m.id} className={`msg ${m.role}`}>
                        {m.role === "agent" && (
                          <div className="meta">
                            <span className="badge">Agente: {m.meta?.agente}</span>
                            <span className="badge">Intent: {m.meta?.intent}</span>
                            <span className="badge">Tarefa: {m.meta?.tarefa}</span>
                            {(m.meta?.tools || []).map((t, i) => (
                              <span className="badge tool-badge" key={`t-${m.id}-${i}`}>
                                tool: {t}
                              </span>
                            ))}
                          </div>
                        )}
                        <div>{m.text}</div>
                      </article>
                    ))}

                    {thinking && (
                      <div className="reasoning">
                        <div className="rz-title">
                          <span className="rz-dot"></span>
                          {thinking.label || "Pensando..."}
                        </div>
                        {thinking.reasoning ? (
                          <div className="rz-text">{thinking.reasoning}</div>
                        ) : (
                          <div className="rz-text" style={{ color: "#8a83a8" }}>
                            Aguardando o raciocinio do modelo...
                          </div>
                        )}
                        {thinking.steps && thinking.steps.length > 0 && (
                          <div className="rz-steps">
                            {thinking.steps.slice(-6).map((s, i) => (
                              <div className="rz-step" key={`step-${i}`}>
                                <code>{s.agente || "-"}</code> {s.detalhe || s.etapa || ""}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>

                  <div className="composer">
                    <textarea
                      value={draft}
                      onChange={(e) => setDraft(e.target.value)}
                      onKeyDown={onKeyDown}
                      placeholder="Digite sua mensagem... (Enter para enviar, Shift+Enter para quebrar linha)"
                    />
                    <button onClick={enviarMensagem} disabled={sending || !draft.trim()}>
                      {sending ? "Enviando..." : "Enviar"}
                    </button>
                  </div>
                </div>

                <aside className="memory">
                  <h3>Memoria do Cliente</h3>
                  <div className="memory-card">
                    <div className="memory-row"><strong>Cliente:</strong> {memoryView?.customer_name || (customerName || "Nao informado")}</div>
                    <div className="memory-row"><strong>Status:</strong> {memoryLoading ? "Carregando..." : (memoryView?.has_memory ? "Com memoria" : "Sem memoria")}</div>
                    <div className="memory-row"><strong>Total interacoes:</strong> {memoryView?.total_interactions ?? 0}</div>
                    <div className="memory-row"><strong>Ultimo intent:</strong> {memoryView?.last_intent || "-"}</div>
                    <div className="memory-row"><strong>Historico LangChain:</strong> {memoryView?.langchain_history_size ?? 0} mensagens</div>
                    {typeof memoryView?.context_available === "boolean" && (
                      <div className="memory-row"><strong>Contexto injetado:</strong> {memoryView.context_available ? "Sim" : "Nao"}</div>
                    )}
                    {typeof memoryView?.is_initial_contact === "boolean" && (
                      <div className="memory-row"><strong>Primeiro contato:</strong> {memoryView.is_initial_contact ? "Sim" : "Nao"}</div>
                    )}
                  </div>

                  <div className="memory-card">
                    <div className="memory-row"><strong>Resumo de memoria</strong></div>
                    <div className="memory-summary">{memoryView?.summary || memoryView?.context_snapshot || "Sem resumo de memoria para exibir."}</div>
                  </div>

                  <div className="memory-log">
                    {(memoryView?.recent_interactions || []).slice(-5).reverse().map((item, idx) => (
                      <div className="memory-log-item" key={`mem-${idx}`}>
                        <div><strong>{item.intent || "-"}</strong> · {item.created_at || ""}</div>
                        <div>Cliente: {(item.message || "").slice(0, 110)}</div>
                        <div>Assistente: {(item.response || "").slice(0, 110)}</div>
                      </div>
                    ))}
                  </div>
                </aside>

                <aside className="calls">
                  <h3>Chamadas ao DeepSeek</h3>
                  <div className="calls-hint">
                    Cada chamada ao modelo e a tool escolhida em tempo real.
                  </div>
                  <div className="calls-list">
                    {deepseekCalls.length === 0 && (
                      <div className="calls-hint">
                        Envie uma mensagem para ver as chamadas ao modelo e as tools acionadas.
                      </div>
                    )}
                    {deepseekCalls.map((c) => (
                      <div className={`call-item ${c.tipo}`} key={c.id}>
                        <div className="call-agent">{c.agente}</div>
                        <span className={`call-tool ${c.tipo === "tool" ? "is-tool" : ""}`}>
                          {c.tipo === "tool" ? "tool: " : (c.tipo === "route" ? "rota: " : "modelo: ")}
                          {c.tool}
                        </span>
                        <div className="call-detail">{c.detalhe}</div>
                      </div>
                    ))}
                  </div>
                </aside>
              </div>
            </section>

            <section className="edu">
              <h2>Como o LangChain e usado nesta aplicacao</h2>
              <p className="edu-lead">
                Explicacao didatica de cada chamada LangChain que acontece quando voce envia uma
                mensagem: definicao do modelo, definicao dos agentes e a memoria do cliente.
              </p>

              <div className="steps">
                <div className="step">
                  <span className="num">1</span>
                  <strong>Voce envia</strong>
                  <span>A UI chama o endpoint <code>/chat/stream</code> (streaming SSE).</span>
                </div>
                <div className="step">
                  <span className="num">2</span>
                  <strong>Memoria</strong>
                  <span>LangChain monta o historico do cliente.</span>
                </div>
                <div className="step">
                  <span className="num">3</span>
                  <strong>Orquestrador</strong>
                  <span>O LLM decide qual agente atende.</span>
                </div>
                <div className="step">
                  <span className="num">4</span>
                  <strong>Agente + Tools</strong>
                  <span>O agente responde usando o modelo e ferramentas.</span>
                </div>
              </div>

              <details open>
                <summary>1. Definicao do modelo (LLM)<span className="tag">app/agents/base.py</span></summary>
                <div className="body">
                  <p>
                    O modelo e criado uma unica vez com a classe <code>ChatOpenAI</code> do pacote
                    <code>langchain_openai</code>. Mesmo usando o DeepSeek, aproveitamos a interface
                    da OpenAI porque a API do DeepSeek e compativel: basta apontar a
                    <code>base_url</code> para o servidor deles.
                  </p>
                  <ul>
                    <li><code>model</code>: qual modelo do DeepSeek sera usado (ex.: <code>deepseek-chat</code>).</li>
                    <li><code>base_url</code>: redireciona as chamadas LangChain para a API do DeepSeek.</li>
                    <li><code>temperature=0.2</code>: respostas mais objetivas e menos aleatorias.</li>
                    <li><code>@lru_cache</code>: cria o modelo so uma vez e reaproveita (cache).</li>
                  </ul>
                  <pre>{`from langchain_openai import ChatOpenAI

@lru_cache
def get_llm() -> ChatOpenAI:
    return ChatOpenAI(
        model="deepseek-chat",
        api_key=api_key,
        base_url="https://api.deepseek.com",
        temperature=0.2,
    )`}</pre>
                  <div className="callout">
                    Ideia central: <strong>get_llm()</strong> e a "ponte" unica com o modelo. Todos os
                    agentes chamam essa mesma funcao, garantindo configuracao consistente.
                  </div>
                </div>
              </details>

              <details>
                <summary>2. Definicao dos agentes (mensagens e tools)<span className="tag">app/agents/*.py</span></summary>
                <div className="body">
                  <p>
                    Cada agente (Atendimento, Vendas, Cancelamento, Reducao de Danos) recebe o mesmo
                    modelo de <code>get_llm()</code> e conversa com ele usando os tipos de mensagem do
                    LangChain:
                  </p>
                  <ul>
                    <li><code>SystemMessage</code>: define o "papel" e as regras do agente.</li>
                    <li><code>HumanMessage</code>: a mensagem do cliente.</li>
                    <li><code>AIMessage</code>: a resposta que o modelo gera.</li>
                    <li><code>ToolMessage</code>: o resultado devolvido por uma ferramenta.</li>
                  </ul>
                  <p>
                    Para consultar voos, o agente usa <code>bind_tools</code>. Isso "ensina" o modelo
                    quais ferramentas existem; o proprio modelo decide quando chamar cada uma
                    (<em>tool calling</em>), e o codigo executa a tool e devolve o resultado num loop.
                  </p>
                  <pre>{`tools = ferramentas_voos()
llm_with_tools = self.llm.bind_tools(tools)

messages = [
    SystemMessage(content="Voce e um agente de vendas..."),
    HumanMessage(content=f"Cliente: {customer_name}\\nPedido: {message}"),
]

ai_msg = llm_with_tools.invoke(messages)   # modelo pensa
for call in ai_msg.tool_calls:             # modelo pediu uma tool?
    resultado = executar_tool(call)
    messages.append(ToolMessage(content=resultado, tool_call_id=call["id"]))`}</pre>
                  <div className="callout">
                    O <strong>Orquestrador</strong> tambem e um agente: ele faz um simples
                    <code>llm.invoke(prompt)</code> e le a resposta para escolher entre atendimento,
                    vendas ou cancelamento. Veja o badge "Agente" acima de cada resposta no chat.
                  </div>
                </div>
              </details>

              <details>
                <summary>3. Memoria do cliente com LangChain<span className="tag">app/memory/store.py</span></summary>
                <div className="body">
                  <p>
                    Antes de responder, a aplicacao reconstroi o historico recente do cliente como
                    uma lista de mensagens LangChain. Cada interacao antiga vira um par
                    <code>HumanMessage</code> (pergunta) + <code>AIMessage</code> (resposta):
                  </p>
                  <pre>{`def build_langchain_history(self, customer_name, limit=6):
    history = []
    for item in self.get_recent_interactions(customer_name, limit):
        history.append(HumanMessage(content=item["message"]))
        history.append(AIMessage(content=item["response"]))
    return history   # memoria no formato que o LLM entende`}</pre>
                  <p>Esse historico e resumido em texto e injetado no prompt do agente:</p>
                  <pre>{`[HISTORICO RECENTE - LANGCHAIN]
- Cliente: Quero voar de Recife para Sao Paulo
- Assistente: Encontrei opcoes de voo direto...`}</pre>
                  <p>A memoria tem tres camadas complementares:</p>
                  <ul>
                    <li><strong>LangChain messages</strong>: historico da conversa (Human/AI) para o modelo.</li>
                    <li><strong>SQLite</strong>: perfil estruturado (origens, destinos, reservas).</li>
                    <li><strong>ChromaDB</strong>: memoria textual/semantica das interacoes.</li>
                  </ul>
                  <div className="callout">
                    O painel "Memoria do Cliente" ao lado do chat mostra exatamente esses dados: o
                    campo <strong>Historico LangChain</strong> conta quantas mensagens foram
                    reconstruidas para dar contexto ao modelo.
                  </div>
                </div>
              </details>

              <details>
                <summary>4. Orquestracao do fluxo com LangGraph<span className="tag">app/graph.py</span></summary>
                <div className="body">
                  <p>
                    Tudo isso e coordenado por um grafo (<code>StateGraph</code> do LangGraph). Ele
                    liga os nos na ordem certa: primeiro o orquestrador decide o intent e, com uma
                    aresta condicional, encaminha para o agente correto.
                  </p>
                  <pre>{`builder.set_entry_point("orquestrador")
builder.add_conditional_edges("orquestrador", route_intent, {
    "atendimento": "atendimento",
    "vendas": "vendas",
    "cancelamento": "reducao_danos",  # retencao antes de cancelar
})
builder.add_edge("reducao_danos", "cancelamento")`}</pre>
                  <div className="callout">
                    Resumo do caminho: <strong>mensagem</strong> &rarr; memoria (LangChain) &rarr;
                    orquestrador (LLM) &rarr; agente (LLM + tools) &rarr; resposta + memoria atualizada.
                  </div>
                </div>
              </details>
            </section>

            <p className="hint">
              Dica: para testar cancelamento com fluxo completo, inclua um pedido de cancelamento e um
              codigo de reserva.
            </p>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
